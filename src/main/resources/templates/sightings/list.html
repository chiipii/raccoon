<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<title>目撃記録一覧</title>
</head>

<body>
	<h1>アライグマ目撃記録</h1>
	
	<h2>集計</h2>
	<p th:if="${recordCount == 0}">まだ記録がありません。</p>
	
	<div th:unless="${recordCount == 0}">
		<p>
			総目撃数<strong th:text="${totalCount}">0</strong>匹
			(記録 <span th:text="${recordCount}">0</span>件)
		</p>
		
		<p>
			最終目撃日
			<strong th:text="${sightings[0].sightedDate}">2026/01/01</strong>
		</p>
		
		<h3>時間帯別</h3>
		<table border="1">
			<tr th:each="entry : ${countByHour}">
				<td th:text="${entry.key} + '時'">0時</td>
				<td th:text="${entry.value} + '匹'">0匹</td>
			</tr>
		</table>
	</div>
	
	<p><a th:href="@{/sightings/new}">新規登録</a></p>
	
	
	<table border="1">
		<thead>
			<tr>
				<th>目撃日</th>
				<th>時刻</th>
				<th>回数</th>
				<th>めも</th>
				<th>編集</th>
			</tr>
		</thead>
		
		<tbody>
			<tr th:each="sighting : ${sightings}">
				<td th:text="${sighting.sightedDate}">2026-01-01</td>
				<td th:text="${sighting.sightedTime.hour} + '時'">0時</td>
				<td th:text="${sighting.count}">0</td>
				<td th:text="${sighting.memo}">めも</td>
				<td>
					<a th:href="@{/sightings/{id}(id=${sighting.id})}">編集</a>
					<a th:href="@{/sightings/{id}/delete(id=${sighting.id})}">削除</a>
				</td>
					
			</tr>
			<tr th:if="${#lists.isEmpty(sightings)}">
				<td colspan="5">記録がありません。</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
