<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	
<meta charset="UTF-8">
<title>目撃記録の編集</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<h1>目撃記録の編集</h1>
	
	<form th:action="@{/sightings/{id}(id=*{id})}" th:object="${raccoonForm}" method="post">
		
		<input type="hidden" th:field="*{id}">
		
		<div th:if="${#fields.hasErrors('notFuture')}" class="error-message">
			<span th:errors="*{notFuture}"></span> 
		</div>
		
		<div>
			<label>目撃日</label>
			<input type="date" th:field="*{sightedDate}" th:errorclass="error">
			<span th:if="${#fields.hasErrors('sightedDate')}"
			      th:errors="*{sightedDate}" class="error-message"></span>
		</div>
		
		<div>
			<label>時刻</label>
			<select th:field="*{sightedHour}" th:errorclass="error">
				<option value="">選択してください</option>
				<option th:each="h : ${#numbers.sequence(0, 23)}"
				        th:value="${h}" th:text="${h} + '時'"></option>
			</select>
			<span th:if="${#fields.hasErrors('sightedHour')}"
			      th:errors="*{sightedHour}" class="error-message"></span>
		</div>
		
		<div>
			<label>回数</label>
			<input type="number" th:field="*{count}" th:errorclass="error">
			<span th:if="${#fields.hasErrors('count')}"
			      th:errors="*{count}" class="error-message"></span>
		</div>
		
		<div>
			<label>めも</label>
			<input type="text" th:field="*{memo}" size="40" th:errorclass="error">
			<span th:if="${#fields.hasErrors('memo')}"
			      th:errors="*{memo}" class="error-message"></span>
		</div>
		
		<button type="submit">更新する</button>

	</form>
	
	<p><a th:href="@{/sightings}">一覧へ戻る</a></p>

</body>
</html>
