<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>

<title>目撃記録の登録</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<h1>目撃記録の登録</h1>

</html>
